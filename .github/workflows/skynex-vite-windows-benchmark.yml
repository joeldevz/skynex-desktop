name: Skynex Vite Windows benchmark

on:
  push:
    branches: [ci/skynex-vite-windows]
    paths:
      - '.github/workflows/skynex-vite-windows-benchmark.yml'
      - 'scripts/vite-windows-benchmark.mjs'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install baseline and isolated benchmark dependencies
        run: |
          test "$(node -p "process.platform + '-' + process.arch")" = win32-x64
          bun install --frozen-lockfile
          mkdir -p .vite-benchmark
          cp scripts/vite-windows-benchmark.mjs .vite-benchmark/benchmark.mjs
          npm install --prefix .vite-benchmark --ignore-scripts --no-audit --no-fund --save-exact \
            vite@8.3.8 @vitejs/plugin-react@6.3.0 @rolldown/plugin-babel@0.3.1 \
            @babel/core@7.29.0 babel-plugin-react-compiler@1.0.0 vite-plugin-pwa@1.3.0
      - name: Compare production web builds
        run: |
          for trial in 'current 1' 'serial 1' 'parallel 1' 'parallel 2' 'serial 2' 'current 2'; do
            read -r mode pass <<< "$trial"
            node --max-old-space-size=6144 .vite-benchmark/benchmark.mjs "$mode" "$pass"
          done
