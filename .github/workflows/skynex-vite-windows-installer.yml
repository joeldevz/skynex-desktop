name: Skynex Windows x64 beta installers

on:
  push:
    branches: [ci/skynex-vite-windows]
    paths:
      - '.github/workflows/skynex-vite-windows-installer.yml'
      - 'scripts/vite-benchmark/package*.json'

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 0.1.4-beta.${{ matrix.beta }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        beta: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      OPENCHAMBER_TARGET_ARCH: x64
      ELECTRON_BUILDER_ARCH: x64
      BETA_VERSION: 0.1.4-beta.${{ matrix.beta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install app dependencies
        run: |
          test "$(node -p "process.platform + '-' + process.arch")" = win32-x64
          bun install --frozen-lockfile
      - name: Install isolated Vite 8 toolchain
        run: |
          mkdir .vite-benchmark
          cp scripts/vite-windows-benchmark.mjs .vite-benchmark/benchmark.mjs
          cp scripts/vite-benchmark/package*.json .vite-benchmark/
          npm ci --prefix .vite-benchmark --ignore-scripts --no-audit --no-fund
      - name: Build and stage web assets
        env:
          TRIAL: ${{ matrix.beta }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.BETA_VERSION;
          if (!/^0\.1\.4-beta\.[12]$/.test(version)) throw Error('Unexpected beta version');
          for (const file of ['package.json', 'packages/electron/package.json', 'packages/web/package.json', 'packages/ui/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE
          bun run --cwd packages/sdk build
          bun run extensions:build
          node --max-old-space-size=6144 .vite-benchmark/benchmark.mjs parallel "$TRIAL"
          test ! -e packages/electron/resources/web-dist
          cp -R ".vite-benchmark/parallel-$TRIAL" packages/electron/resources/web-dist
      - name: Prepare native payload and bundle Electron
        working-directory: packages/electron
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          OPENCHAMBER_UPDATER_E2E_BUILD=1 bun run bundle:main
          node ./scripts/rebuild-native.mjs
      - name: Build Windows NSIS installer
        working-directory: packages/electron
        run: node ./scripts/package.mjs --win --x64 --publish=never
      - name: Verify packaged CLI, web assets and update manifest
        working-directory: packages/electron
        run: |
          bun run verify:opencode-cli:packaged
          web=dist/win-unpacked/resources/web-dist
          for entry in index.html mobile.html mini-chat.html sw.js; do
            test -s "$web/$entry"
            cmp "$web/$entry" "resources/web-dist/$entry"
          done
          grep -lF 'react.memo_cache_sentinel' "$web"/assets/OnboardingScreen-*.js
          version=$(node -p "require('./package.json').version")
          installer="dist/Skynex-$version-win-x64.exe"
          test -s "$installer.blockmap"
          if [[ ! -f dist/latest.yml ]]; then
            cp dist/beta.yml dist/latest.yml
          fi
          node ./scripts/verify-update-manifest.mjs dist/latest.yml "$version" "$installer"
      - name: Smoke-test the installed Windows app
        shell: pwsh
        working-directory: packages/electron
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "dist/Skynex-$version-win-x64.exe").Path
          $root = Join-Path $env:RUNNER_TEMP ('skynex-smoke-' + [guid]::NewGuid().ToString('N'))
          $installDir = Join-Path $root 'installed'
          $env:OPENCHAMBER_DATA_DIR = Join-Path $root 'data'
          $env:OPENCHAMBER_DESKTOP_USER_DATA_DIR = Join-Path $root 'profile'
          New-Item -ItemType Directory -Path $root | Out-Null
          $probe = Join-Path $root 'renderer.mjs'
          @'
          const port = Number(process.argv[2]);
          const appOrigin = 'openchamber-ui://app/';
          const response = await fetch(`http://127.0.0.1:${port}/json/list`, {
            redirect: 'error', signal: AbortSignal.timeout(2000),
          });
          if (!response.ok) throw Error('DevTools target list unavailable');
          const page = (await response.json()).find((target) => target.type === 'page' && target.url.startsWith(appOrigin));
          if (!page?.webSocketDebuggerUrl) throw Error('Packaged app target unavailable');
          const socketUrl = new URL(page.webSocketDebuggerUrl);
          if (socketUrl.origin !== `ws://127.0.0.1:${port}` || !socketUrl.pathname.startsWith('/devtools/page/')) {
            throw Error('Unexpected DevTools socket');
          }
          const socket = new WebSocket(socketUrl);
          try {
            const ready = await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(Error('DevTools renderer probe timed out')), 3000);
              socket.addEventListener('open', () => socket.send(JSON.stringify({
                id: 1, method: 'Runtime.evaluate',
                params: {
                  expression: `location.href.startsWith(${JSON.stringify(appOrigin)})
                    && document.querySelector('#root')?.childElementCount > 0
                    && !document.querySelector('#root #initial-loading')`,
                  returnByValue: true,
                },
              })), { once: true });
              socket.addEventListener('message', (message) => {
                const data = JSON.parse(message.data);
                if (data.id !== 1) return;
                clearTimeout(timer);
                resolve(data.result?.result?.value === true);
              });
            });
            if (!ready) throw Error('Packaged React renderer has not mounted');
            console.log('SKYNEX_RENDERER_MOUNTED origin=openchamber-ui://app');
          } finally {
            socket.close();
          }
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          $process = $null
          try {
            $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -PassThru -Wait
            if ($setup.ExitCode -ne 0) { throw "NSIS installer exited $($setup.ExitCode)" }
            $exe = Join-Path $installDir 'Skynex.exe'
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'NSIS did not create Skynex.exe in the test directory' }
            $expectedHash = (Get-FileHash dist/win-unpacked/Skynex.exe -Algorithm SHA256).Hash
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Installed executable differs from the packaged executable'
            }
            $reservation = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $reservation.Start()
            try { $debugPort = $reservation.LocalEndpoint.Port } finally { $reservation.Stop() }
            $process = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -ArgumentList @(
              '--remote-debugging-address=127.0.0.1', "--remote-debugging-port=$debugPort"
            )
            $settings = Join-Path $env:OPENCHAMBER_DATA_DIR 'settings.json'
            $deadline = (Get-Date).AddMinutes(2)
            $ready = $false
            do {
              $process.Refresh()
              if ($process.HasExited) { throw "Installed app exited early ($($process.ExitCode))" }
              if (Test-Path -LiteralPath $settings -PathType Leaf) {
                try {
                  $port = (Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).desktopLocalPort
                  if ($port -ge 1 -and $port -le 65535) {
                    $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -TimeoutSec 3
                    $ready = $health.StatusCode -eq 200
                  }
                } catch { $ready = $false }
              }
              if (!$ready) { Start-Sleep -Milliseconds 500 }
            } while (!$ready -and (Get-Date) -lt $deadline)
            if (!$ready) { throw 'Installed app did not start its embedded server' }
            $mounted = $false
            do {
              $process.Refresh()
              if ($process.HasExited) { throw 'Installed app exited before mounting the renderer' }
              $listeners = @(Get-NetTCPConnection -LocalPort $debugPort -State Listen -ErrorAction SilentlyContinue)
              if ($listeners.Count) {
                foreach ($entry in $listeners) {
                  if ($entry.OwningProcess -ne $process.Id -or $entry.LocalAddress -notin @('127.0.0.1', '::1')) {
                    throw 'DevTools listener was not owned by the installed app on loopback'
                  }
                }
                node $probe $debugPort 2> (Join-Path $root 'renderer-error.log')
                $mounted = $LASTEXITCODE -eq 0
              }
              if (!$mounted) { Start-Sleep -Milliseconds 500 }
            } while (!$mounted -and (Get-Date) -lt $deadline)
            if (!$mounted) { throw 'Installed app did not mount the packaged React renderer' }
            Write-Host "SKYNEX_INSTALLED_SMOKE version=$version pid=$($process.Id) executable=$exe sha256=$expectedHash health=200"
          } finally {
            if ($process -and !$process.HasExited) {
              $null = $process.CloseMainWindow()
              if (!$process.WaitForExit(45000)) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'Could not stop the isolated app process tree' }
              }
            }
            $prefix = $installDir + '\'
            $remaining = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)
            })
            foreach ($entry in $remaining) { Stop-Process -Id $entry.ProcessId -Force -ErrorAction SilentlyContinue }
            if (Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)
            }) { throw 'Installed app processes survived cleanup' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skynex-windows-x64-${{ env.BETA_VERSION }}
          path: |
            packages/electron/dist/Skynex-*-win-x64.exe
            packages/electron/dist/Skynex-*-win-x64.exe.blockmap
            packages/electron/dist/latest.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
