name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version
        id: get_version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for release
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          title=$(node scripts/changelog/release-notes.mjs "$VERSION" artifacts/release-notes.md)
          echo "name=Skynex v$VERSION: $title" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: ${{ steps.release_notes.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set packaged app version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node -e "const fs = require('node:fs'); const path = 'packages/electron/package.json'; const pkg = JSON.parse(fs.readFileSync(path, 'utf8')); pkg.version = process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')"
      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets
      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main
      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: node ./scripts/rebuild-native.mjs
      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
      - name: Upload Windows installers to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/electron/dist/Skynex-${{ needs.create-release.outputs.version }}-win-${{ matrix.arch }}.exe
            packages/electron/dist/Skynex-${{ needs.create-release.outputs.version }}-win-${{ matrix.arch }}.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows manifest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-manifest-${{ matrix.arch }}
          path: packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set packaged app version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node -e "const fs = require('node:fs'); const path = 'packages/electron/package.json'; const pkg = JSON.parse(fs.readFileSync(path, 'utf8')); pkg.version = process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')"
      - name: Install rpmbuild for the .rpm package
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build and package Linux AppImage, .deb and .rpm
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage
      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$VERSION" \
            "dist/Skynex-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage" \
            "dist/Skynex-${VERSION}-linux-${DEB_ARCH}.deb" \
            "dist/Skynex-${VERSION}-linux-${RPM_ARCH}.rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/Skynex-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/Skynex-${{ needs.create-release.outputs.version }}-linux-${{ matrix.deb_arch }}.deb
            packages/electron/dist/Skynex-${{ needs.create-release.outputs.version }}-linux-${{ matrix.rpm_arch }}.rpm
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  build-cli-runtime:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Verify native runtime target
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
      - name: Install dependencies and build runtime payload
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/sdk build
          bun run --cwd packages/web build
      - name: Verify native ripgrep payload
        working-directory: packages/web
        run: |
          node --input-type=module -e "import { rgPath } from '@vscode/ripgrep'; import { spawnSync } from 'node:child_process'; const result = spawnSync(rgPath, ['--version'], { encoding: 'utf8' }); if (result.status !== 0 || !result.stdout.startsWith('ripgrep ')) throw new Error('Native ripgrep smoke failed'); console.log(result.stdout.trim());"
      - name: Package and smoke-test standalone CLI
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCHIVE_ARCH: ${{ matrix.arch }}
          ARCHIVE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli
          bun run --cwd packages/web package:cli --output "$GITHUB_WORKSPACE/artifacts/cli" --version "$VERSION"
          bun build packages/web/scripts/skynex-app-install.mjs --target=node --outfile artifacts/cli/skynex-app-install.mjs
          archive="artifacts/cli/skynex-app-${VERSION}-${ARCHIVE_PLATFORM}-${ARCHIVE_ARCH}.tar.gz"
          mkdir -p artifacts/cli/extracted
          tar -xzf "$archive" -C artifacts/cli/extracted
          app="$GITHUB_WORKSPACE/artifacts/cli/extracted/skynex-app"
          node "$app/bin/cli.js" --version | grep -Fx "$VERSION"
          node "$app/bin/cli.js" --help >/dev/null
          (cd "$app" && node --input-type=module -e "import('node-pty').then(() => console.log('node-pty import ok'))")
          (cd "$app" && node --input-type=module -e "import { rgPath } from '@vscode/ripgrep'; import { spawnSync } from 'node:child_process'; const result = spawnSync(rgPath, ['--version'], { encoding: 'utf8' }); if (result.status !== 0 || !result.stdout.startsWith('ripgrep ')) throw new Error('Packaged ripgrep smoke failed'); console.log(result.stdout.trim());")
          test -s "$app/LICENSE"
          grep -qi 'OpenChamber' "$app/README.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/cli/skynex-app-${{ needs.create-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            artifacts/cli/skynex-app-${{ needs.create-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        with:
          name: cli-installer-bootstrap
          path: artifacts/cli/skynex-app-install.mjs
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [create-release, build-windows, build-linux, build-cli-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-manifest-*
          path: artifacts/windows
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-release-*
          path: artifacts/linux
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-runtime-*
          path: artifacts/cli
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-installer-bootstrap
          path: artifacts/cli
      - name: Prepare Windows update manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ready
          cp artifacts/windows/windows-manifest-x64/latest.yml artifacts/ready/latest.yml
          cp artifacts/windows/windows-manifest-arm64/latest.yml artifacts/ready/latest-arm64.yml
          cp artifacts/linux/linux-release-x64/* artifacts/ready/
          cp artifacts/linux/linux-release-arm64/* artifacts/ready/
          cp artifacts/cli/* artifacts/ready/
          cp scripts/install.sh artifacts/ready/install.sh
          test "$(grep -c "^version: $VERSION$" artifacts/ready/latest.yml)" -eq 1
          test "$(grep -c "^version: $VERSION$" artifacts/ready/latest-arm64.yml)" -eq 1
      - name: Upload Linux packages and manifests to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: artifacts/ready/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify complete release asset inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          node - <<'NODE'
          (async () => {
            const { REPOSITORY: repo, VERSION: version, RELEASE_ID: releaseId, GITHUB_TOKEN: token } = process.env;
            const expected = [
              `Skynex-${version}-win-x64.exe`,
              `Skynex-${version}-win-x64.exe.blockmap`,
              `Skynex-${version}-win-arm64.exe`,
              `Skynex-${version}-win-arm64.exe.blockmap`,
              'latest.yml', 'latest-arm64.yml',
              `Skynex-${version}-linux-x86_64.AppImage`,
              `Skynex-${version}-linux-amd64.deb`,
              `Skynex-${version}-linux-x86_64.rpm`,
              'latest-linux.yml',
              `Skynex-${version}-linux-arm64.AppImage`,
              `Skynex-${version}-linux-arm64.deb`,
              `Skynex-${version}-linux-aarch64.rpm`,
              'latest-linux-arm64.yml',
              ...['linux-x64', 'linux-arm64', 'win32-x64', 'win32-arm64'].flatMap((target) => [
                `skynex-app-${version}-${target}.tar.gz`,
                `skynex-app-${version}-${target}.tar.gz.sha256`,
              ]),
              'skynex-app-install.mjs',
              'install.sh',
            ];
            const response = await fetch(`https://api.github.com/repos/${repo}/releases/${releaseId}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
            });
            if (!response.ok) throw new Error(`Failed to inspect draft release assets: ${response.status} ${await response.text()}`);
            const release = await response.json();
            if (!release.draft) throw new Error('Release was published before inventory validation');
            for (const name of expected) {
              const matches = release.assets.filter((asset) => asset.name === name);
              if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
              if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) throw new Error(`Release asset ${name} has invalid size`);
            }
            const unexpected = release.assets.filter((asset) => !expected.includes(asset.name));
            if (unexpected.length) throw new Error(`Unexpected release assets: ${unexpected.map((asset) => asset.name).join(', ')}`);
            console.log(`Verified all ${expected.length} Windows and Linux release assets.`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
