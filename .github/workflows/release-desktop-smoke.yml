name: Desktop Release Build Smoke

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository containing the validation commit
        required: false
        default: joeldevz/skynex-desktop
        type: string
      ref:
        description: Exact validation commit SHA
        required: true
        type: string
      build_macos:
        description: Build unsigned macOS Electron artifacts
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build Windows Electron installer artifacts
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux Electron AppImage artifacts
        required: false
        default: true
        type: boolean
      retention_days:
        description: Artifact retention days
        required: false
        default: "7"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validation-target:
    name: Verify immutable fork validation target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the dispatched commit and public fork
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = joeldevz/skynex-desktop
          test "$REQUESTED_REPOSITORY" = "$GITHUB_REPOSITORY"
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_REF" = "$GITHUB_SHA"
          printf 'Validated source commit %s\n' "$GITHUB_SHA"

  build-cli-runtime:
    needs: validation-target
    name: Standalone CLI (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Verify native runtime target
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
      - name: Install dependencies and build runtime payload
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/sdk build
          bun run --cwd packages/web build
      - name: Verify native ripgrep payload
        working-directory: packages/web
        run: |
          node --input-type=module -e "import { rgPath } from '@vscode/ripgrep'; import { spawnSync } from 'node:child_process'; const result = spawnSync(rgPath, ['--version'], { encoding: 'utf8' }); if (result.status !== 0 || !result.stdout.startsWith('ripgrep ')) throw new Error('Native ripgrep smoke failed'); console.log(result.stdout.trim());"
      - name: Package and smoke-test standalone CLI
        env:
          VERSION: ${{ inputs.ref }}
          ARCHIVE_ARCH: ${{ matrix.arch }}
          ARCHIVE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then VERSION="$(node -p "require('./packages/web/package.json').version")"; fi
          mkdir -p artifacts/cli
          bun run --cwd packages/web package:cli --output "$GITHUB_WORKSPACE/artifacts/cli" --version "$VERSION"
          bun build packages/web/scripts/skynex-app-install.mjs --target=node --outfile artifacts/cli/skynex-app-install.mjs
          archive="artifacts/cli/skynex-app-${VERSION}-${ARCHIVE_PLATFORM}-${ARCHIVE_ARCH}.tar.gz"
          mkdir -p artifacts/cli/extracted
          tar -xzf "$archive" -C artifacts/cli/extracted
          app="$GITHUB_WORKSPACE/artifacts/cli/extracted/skynex-app"
          node "$app/bin/cli.js" --version | grep -Fx "$VERSION"
          node "$app/bin/cli.js" --help >/dev/null
          (cd "$app" && node --input-type=module -e "import('node-pty').then(() => console.log('node-pty import ok'))")
          test -s "$app/LICENSE"
          grep -qi 'OpenChamber' "$app/README.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/cli/skynex-app-*.tar.gz*
            artifacts/cli/skynex-app-install.mjs
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  build-macos-electron:
    needs: validation-target
    if: ${{ inputs.build_macos }}
    name: Build macOS Electron (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build Electron app
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own. Rebuild against the target
          # Electron ABI before packaging, matching the release workflow.
          bun run rebuild:native
          bunx electron-builder --mac --${{ matrix.arch }} --publish=never -c.mac.identity=null -c.mac.notarize=false
          bun run verify:opencode-cli:packaged

      - name: Upload macOS installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-macos-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  build-windows-electron:
    needs: validation-target
    if: ${{ inputs.build_windows }}
    name: Build Windows Electron (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own. Rebuild against the target
        # Electron ABI before packaging, matching the release workflow.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        env:
          # verify:opencode-cli:packaged checks the CLI against the target arch.
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload Windows installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-windows-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  build-linux-electron:
    needs: validation-target
    if: ${{ inputs.build_linux }}
    name: Build Linux Electron (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install rpmbuild for the .rpm package
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Xvfb for the x64 AppImage runtime check
        if: ${{ matrix.arch == 'x64' }}
        run: sudo apt-get install -y xvfb

      - name: Get build versions
        id: versions
        shell: bash
        run: |
          echo "opencode_cli=$(node -p "require('./packages/electron/package.json').opencodeCli.version")" >> "$GITHUB_OUTPUT"
          echo "app=$(node -p "require('./packages/electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.versions.outputs.opencode_cli }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage, .deb and .rpm
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage -- "dist/Skynex-$(node -p "require('./package.json').version")-linux-${{ matrix.artifact_arch }}.AppImage"

      - name: Open the built x64 AppImage and exercise its composer
        if: ${{ matrix.arch == 'x64' }}
        working-directory: packages/electron
        env:
          SMOKE_APPIMAGE_ONLY: '1'
          SMOKE_APPIMAGE_PATH: ${{ github.workspace }}/packages/electron/dist/Skynex-${{ steps.versions.outputs.app }}-linux-${{ matrix.artifact_arch }}.AppImage
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/appimage-graphical
        run: |
          set -euo pipefail
          extracted="$(mktemp -d "$RUNNER_TEMP/skynex-appimage.XXXXXX")"
          trap 'rm -rf -- "$extracted"' EXIT
          (cd "$extracted" && "$SMOKE_APPIMAGE_PATH" --appimage-extract > /dev/null)
          sandbox="$extracted/squashfs-root/chrome-sandbox"
          test -f "$sandbox" && test ! -L "$sandbox"
          sudo chown root:root -- "$sandbox"
          sudo chmod 4755 -- "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
          export SMOKE_APPIMAGE_EXECUTABLE="$extracted/squashfs-root/AppRun"
          export SMOKE_APPIMAGE_DIR="$extracted/squashfs-root"
          xvfb-run -a node scripts/smoke-native-ui.mjs

      - name: Upload AppImage graphical evidence
        if: ${{ always() && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-appimage-graphical-linux-x64
          path: artifacts/appimage-graphical
          if-no-files-found: warn
          retention-days: ${{ fromJSON(inputs.retention_days) }}

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ steps.versions.outputs.app }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$VERSION" \
            "dist/Skynex-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage" \
            "dist/Skynex-${VERSION}-linux-${DEB_ARCH}.deb" \
            "dist/Skynex-${VERSION}-linux-${RPM_ARCH}.rpm"

      - name: Upload Linux installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-linux-${{ matrix.arch }}
          path: |
            packages/electron/dist/Skynex-${{ steps.versions.outputs.app }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/Skynex-${{ steps.versions.outputs.app }}-linux-${{ matrix.deb_arch }}.deb
            packages/electron/dist/Skynex-${{ steps.versions.outputs.app }}-linux-${{ matrix.rpm_arch }}.rpm
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  graphical-linux:
    needs: validation-target
    name: Electron HMR and bundled UI with Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Prepare isolated graphical runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          bun install --frozen-lockfile
          bun run --cwd packages/electron ensure:electron
          bun run --cwd packages/electron build:web-assets
          bun run --cwd packages/electron rebuild:native
          bun run --cwd packages/electron prepare:opencode-cli
          bun run --cwd packages/electron verify:opencode-cli
      - name: Configure Electron sandbox on the disposable runner
        working-directory: packages/electron
        run: |
          set -euo pipefail
          sandbox="$(realpath "$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")")"
          case "$sandbox" in
            "$GITHUB_WORKSPACE"/*/chrome-sandbox) ;;
            *) echo "Sandbox helper is outside the checked-out runtime" >&2; exit 1 ;;
          esac
          test -f "$sandbox"
          test ! -L "$sandbox"
          sudo chown root:root -- "$sandbox"
          sudo chmod 4755 -- "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
      - name: Run native graphical smoke
        env:
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/graphical
        run: xvfb-run -a node packages/electron/scripts/smoke-native-ui.mjs
      - name: Upload graphical evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-graphical-linux
          path: artifacts/graphical
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}
